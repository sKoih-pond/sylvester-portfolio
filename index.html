<!doctype html>
<html lang="en" data-theme="day">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Sylvester Koh — IT professional building applied analytics, automation, and cloud capability." />
    <title>Sylvester Koh</title>
    <!-- Flash-free first paint: apply the last-known solar phase before React
         mounts, so return visitors paint the correct palette immediately. -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem("sk_theme");
          if (p) document.documentElement.dataset.theme = p;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
